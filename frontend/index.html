<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SentinelOps | Linux Log Telemetry & Hybrid-RAG Copilot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const PRESET_SIMULATIONS = [
      {
        label: "Nginx Port 80 Conflict (EADDRINUSE)",
        stack: "Nginx",
        log: "INFO: Health probe started from 10.12.4.88\nnginx: [emerg] bind() to 0.0.0.0:80 failed (98: Address already in use)\nsystemd[1]: nginx.service: Main process exited, code=exited, status=1/FAILURE"
      },
      {
        label: "Linux Kernel OOM-Killer (Exit Code 137)",
        stack: "Linux",
        log: "DEBUG: GC pause 140ms\nkernel: [48219.112] Out of memory: Killed process 2194 (java) total-vm:2412904kB, anon-rss:912400kB\nDATABASE_URL=postgresql://admin:SuperSecretPass99@10.0.1.50:5432/prod"
      },
      {
        label: "Disk Exhaustion (/var/log ENOSPC)",
        stack: "Linux",
        log: "INFO: Log rotation check\nsystemd-journald[412]: Failed to write entry (28: No space left on device) - /var/log partition at 100%"
      },
      {
        label: "Docker Socket Permission Denied",
        stack: "Docker",
        log: "Got permission denied while trying to connect to the Docker daemon socket at unix:///var/run/docker.sock"
      }
    ];

    function App() {
      const [rawLog, setRawLog] = useState(PRESET_SIMULATIONS[0].log);
      const [stack, setStack] = useState("All");
      const [result, setResult] = useState(null);
      const [incidents, setIncidents] = useState([]);
      const [loading, setLoading] = useState(false);
      const [copied, setCopied] = useState(false);

      const fetchIncidents = async () => {
        try {
          const res = await fetch("/api/incidents?limit=8");
          if (res.ok) setIncidents(await res.json());
        } catch (e) {}
      };

      useEffect(() => {
        fetchIncidents();
        const timer = setInterval(fetchIncidents, 10000);
        return () => clearInterval(timer);
      }, []);

      const runDiagnosis = async (sourceType = "manual") => {
        if (!rawLog.trim()) return;
        setLoading(true);
        try {
          const res = await fetch("/api/diagnose", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              raw_log: rawLog,
              stack_filter: stack,
              hostname: sourceType === "simulator" ? "ubuntu-cloud-vm-01" : "sysadmin-console",
              source_type: sourceType
            })
          });
          const data = await res.json();
          setResult(data);
          fetchIncidents();
        } finally {
          setLoading(false);
        }
      };

      const copyCommands = (cmds) => {
        navigator.clipboard.writeText(cmds.join("\n"));
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      return (
        <div className="max-w-7xl mx-auto p-6">
          <header className="flex flex-wrap justify-between items-center border-b border-slate-800 pb-4 mb-6 gap-4">
            <div>
              <div className="flex items-center gap-3">
                <span className="h-3 w-3 rounded-full bg-emerald-400 animate-pulse"></span>
                <h1 className="text-2xl font-bold text-white tracking-tight">SentinelOps <span className="text-emerald-400">Linux AIOps Copilot</span></h1>
              </div>
              <p className="text-sm text-slate-400 mt-1">Automated Linux Log Telemetry, PII Sanitization, Hybrid-RAG Diagnosis & Command Safety Guardrails</p>
            </div>
            <div className="flex gap-3">
              {result?.incident_id && (
                <a
                  href={`/api/export/${result.incident_id}`}
                  download={`SentinelOps_PostMortem_${result.incident_id}.md`}
                  className="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition"
                >
                  Export Post-Mortem (.md)
                </a>
              )}
            </div>
          </header>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 mb-8">
            <div className="lg:col-span-5 bg-slate-900 border border-slate-800 rounded-xl p-5 flex flex-col justify-between">
              <div>
                <div className="flex justify-between items-center mb-3">
                  <span className="text-xs font-semibold uppercase tracking-wider text-slate-400">1. Linux Crash Simulator / Log Input</span>
                  <select
                    value={stack}
                    onChange={(e) => setStack(e.target.value)}
                    className="bg-slate-800 border border-slate-700 rounded px-2.5 py-1 text-xs text-slate-200"
                  >
                    <option value="All">All Stacks</option>
                    <option value="Linux">Linux / Systemd</option>
                    <option value="Nginx">Nginx Proxy</option>
                    <option value="Docker">Docker Engine</option>
                    <option value="Database">PostgreSQL</option>
                  </select>
                </div>

                <div className="grid grid-cols-2 gap-2 mb-3">
                  {PRESET_SIMULATIONS.map((sim, idx) => (
                    <button
                      key={idx}
                      onClick={() => { setRawLog(sim.log); setStack(sim.stack); }}
                      className="text-left text-xs bg-slate-800/80 hover:bg-slate-700 border border-slate-700 rounded-lg p-2 text-slate-300 transition truncate"
                      title={sim.label}
                    >
                      Simulate: {sim.label}
                    </button>
                  ))}
                </div>

                <textarea
                  rows={9}
                  value={rawLog}
                  onChange={(e) => setRawLog(e.target.value)}
                  placeholder="Paste Linux /var/log/syslog, journalctl, or container crash trace..."
                  className="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 font-mono text-xs text-emerald-300 focus:outline-none focus:border-emerald-500"
                />
              </div>

              <div className="flex gap-2 mt-4">
                <button
                  onClick={() => runDiagnosis("manual")}
                  disabled={loading}
                  className="flex-1 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white py-2.5 rounded-lg text-sm font-semibold transition"
                >
                  {loading ? "Running Hybrid RAG..." : "Diagnose Terminal Log"}
                </button>
                <button
                  onClick={() => runDiagnosis("simulator")}
                  disabled={loading}
                  className="bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white px-4 py-2.5 rounded-lg text-sm font-semibold transition"
                >
                  Simulate Agent Alert
                </button>
              </div>
            </div>

            <div className="lg:col-span-7 bg-slate-900 border border-slate-800 rounded-xl p-5">
              {!result ? (
                <div className="h-full flex flex-col items-center justify-center text-center py-16 text-slate-500">
                  <p className="text-base font-medium text-slate-400">SentinelOps Ready for Incident Triage</p>
                  <p className="text-xs max-w-md mt-2">Select a simulated Linux failure on the left or run the systemd collector agent on your Linux VM to stream real-time crash diagnostics.</p>
                </div>
              ) : (
                <div className="space-y-4">
                  {result.diagnosis.risk_level === "HIGH_RISK" ? (
                    <div className="bg-red-950/90 border border-red-500 text-red-200 px-4 py-3 rounded-lg text-xs font-semibold">
                      HIGH-RISK COMMAND GUARDRAIL TRIGGERED: Destructive command detected ({result.diagnosis.flagged_commands?.join(", ")}). Manual verification required!
                    </div>
                  ) : (
                    <div className="bg-emerald-950/50 border border-emerald-700/60 text-emerald-300 px-4 py-2 rounded-lg text-xs font-medium flex justify-between">
                      <span>Command Safety Guardrail: SAFE (Non-destructive remediation)</span>
                      <span>Noise Lines Filtered: {result.noise_lines_dropped}</span>
                    </div>
                  )}

                  <div>
                    <div className="flex justify-between items-center">
                      <span className="text-xs uppercase tracking-wider text-slate-400 font-semibold">Sanitized Payload Sent to LLM</span>
                      <span className="text-xs text-amber-400">
                        {Object.keys(result.redactions || {}).length > 0
                          ? `Redacted: ${JSON.stringify(result.redactions)}`
                          : "Zero PII/Secrets Exposed"}
                      </span>
                    </div>
                    <pre className="bg-slate-950 border border-slate-800 p-2.5 rounded-lg font-mono text-xs text-amber-300 mt-1 overflow-x-auto">{result.sanitized_log}</pre>
                  </div>

                  <div>
                    <span className="text-xs uppercase tracking-wider text-slate-400 font-semibold">Root Cause Analysis</span>
                    <p className="text-sm text-slate-200 mt-1 leading-relaxed">{result.diagnosis.root_cause}</p>
                  </div>

                  <div>
                    <div className="flex justify-between items-center mb-1">
                      <span className="text-xs uppercase tracking-wider text-slate-400 font-semibold">Verified Remediation Commands</span>
                      <button
                        onClick={() => copyCommands(result.diagnosis.fix_commands || [])}
                        className="text-xs bg-slate-800 hover:bg-slate-700 text-emerald-400 px-2.5 py-1 rounded"
                      >
                        {copied ? "Copied!" : "Copy Commands"}
                      </button>
                    </div>
                    <pre className="bg-slate-950 border border-slate-800 p-3 rounded-lg font-mono text-xs text-emerald-400 overflow-x-auto">
                      {(result.diagnosis.fix_commands || []).join("\n")}
                    </pre>
                  </div>

                  <div className="pt-1">
                    <span className="text-xs uppercase tracking-wider text-slate-400 font-semibold block mb-1.5">Grounded Knowledge Base Citations</span>
                    <div className="flex flex-wrap gap-2">
                      {(result.diagnosis.citations || []).map((c, idx) => (
                        <span key={idx} className="bg-cyan-950/70 border border-cyan-700/60 text-cyan-300 text-xs px-2.5 py-1 rounded-full font-mono">
                          {c}
                        </span>
                      ))}
                    </div>
                  </div>
                </div>
              )}
            </div>
          </div>

          <div className="bg-slate-900 border border-slate-800 rounded-xl p-5">
            <div className="flex justify-between items-center mb-4">
              <h2 className="text-sm font-bold uppercase tracking-wider text-slate-300">Live Server Health & Webhook Incident Feed (PostgreSQL Persistent)</h2>
              <button onClick={fetchIncidents} className="text-xs text-emerald-400 hover:underline">Refresh Feed</button>
            </div>
            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse text-xs">
                <thead>
                  <tr className="border-b border-slate-800 text-slate-400">
                    <th className="py-2 px-3">ID</th>
                    <th className="py-2 px-3">Node / Host</th>
                    <th className="py-2 px-3">Source</th>
                    <th className="py-2 px-3">Stack</th>
                    <th className="py-2 px-3">Telemetry (CPU / RAM / Disk)</th>
                    <th className="py-2 px-3">Safety</th>
                    <th className="py-2 px-3">Timestamp</th>
                    <th className="py-2 px-3">Report</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800/70">
                  {incidents.map((inc) => (
                    <tr key={inc.id} className="hover:bg-slate-800/40">
                      <td className="py-2.5 px-3 font-mono text-emerald-400">#INC-{inc.id}</td>
                      <td className="py-2.5 px-3 font-mono text-slate-200">{inc.hostname}</td>
                      <td className="py-2.5 px-3">
                        <span className={`px-2 py-0.5 rounded text-[11px] ${inc.source_type === "systemd-agent" ? "bg-indigo-950 text-indigo-300 border border-indigo-700" : "bg-slate-800 text-slate-300"}`}>
                          {inc.source_type}
                        </span>
                      </td>
                      <td className="py-2.5 px-3 text-slate-300">{inc.stack_tag}</td>
                      <td className="py-2.5 px-3 font-mono text-slate-400">
                        {inc.cpu_load} | {inc.mem_used_pct}% | {inc.disk_used_pct}%
                      </td>
                      <td className="py-2.5 px-3">
                        <span className={`px-2 py-0.5 rounded font-semibold ${inc.risk_level === "HIGH_RISK" ? "bg-red-950 text-red-400" : "bg-emerald-950 text-emerald-400"}`}>
                          {inc.risk_level}
                        </span>
                      </td>
                      <td className="py-2.5 px-3 text-slate-400">{inc.created_at}</td>
                      <td className="py-2.5 px-3">
                        <a href={`/api/export/${inc.id}`} download={`SentinelOps_Incident_${inc.id}.md`} className="text-cyan-400 hover:underline">.md</a>
                      </td>
                    </tr>
                  ))}
                  {incidents.length === 0 && (
                    <tr><td colSpan="8" className="py-6 text-center text-slate-500">No incidents recorded yet. Trigger a simulation or run the Linux collector agent.</td></tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
