<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SentinelOps | Enterprise AIOps & Linux Copilot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-emerald-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const PRESET_SIMULATIONS = [
      {
        label: "Nginx Port 80 Conflict (EADDRINUSE)",
        stack: "Nginx",
        log: "INFO: Health probe started from 10.12.4.88\nnginx: [emerg] bind() to 0.0.0.0:80 failed (98: Address already in use)\nsystemd[1]: nginx.service: Main process exited, code=exited, status=1/FAILURE"
      },
      {
        label: "Linux Kernel OOM-Killer (Exit Code 137)",
        stack: "Linux",
        log: "DEBUG: GC pause 140ms\nkernel: [48219.112] Out of memory: Killed process 2194 (java) total-vm:2412904kB, anon-rss:912400kB\nDATABASE_URL=postgresql://admin:SuperSecretPass99@10.0.1.50:5432/prod"
      },
      {
        label: "Disk Exhaustion (/var/log ENOSPC)",
        stack: "Linux",
        log: "INFO: Log rotation check\nsystemd-journald[412]: Failed to write entry (28: No space left on device) - /var/log partition at 100%"
      },
      {
        label: "Docker Socket Permission Denied",
        stack: "Docker",
        log: "Got permission denied while trying to connect to the Docker daemon socket at unix:///var/run/docker.sock"
      }
    ];

    function App() {
      const [rawLog, setRawLog] = useState(PRESET_SIMULATIONS[0].log);
      const [stack, setStack] = useState("All");
      const [result, setResult] = useState(null);
      const [incidents, setIncidents] = useState([]);
      const [loading, setLoading] = useState(false);
      const [copied, setCopied] = useState(false);
      const [logCopied, setLogCopied] = useState(false);
      const [errorMsg, setErrorMsg] = useState(null);
      const [filterTag, setFilterTag] = useState("All");

      const fetchIncidents = async () => {
        try {
          const res = await fetch("/api/incidents?limit=15");
          if (res.ok) setIncidents(await res.json());
        } catch (e) {}
      };

      useEffect(() => {
        fetchIncidents();
        const timer = setInterval(fetchIncidents, 10000);
        return () => clearInterval(timer);
      }, []);

      const runDiagnosis = async (sourceType = "manual") => {
        if (!rawLog.trim()) return;
        setLoading(true);
        setErrorMsg(null);
        try {
          const res = await fetch("/api/diagnose", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              raw_log: rawLog,
              stack_filter: stack,
              hostname: sourceType === "simulator" ? "ubuntu-cloud-vm-01" : "sysadmin-console",
              source_type: sourceType
            })
          });
          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.detail || JSON.stringify(data) || "Server error");
          }
          setResult(data);
          fetchIncidents();
        } catch (err) {
          setErrorMsg(err.message);
        } finally {
          setLoading(false);
        }
      };

      const copyCommands = (cmds) => {
        navigator.clipboard.writeText(cmds.join("\n"));
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      const copyRawLog = () => {
        navigator.clipboard.writeText(rawLog);
        setLogCopied(true);
        setTimeout(() => setLogCopied(false), 2000);
      };

      const filteredIncidents = incidents.filter(inc => filterTag === "All" || inc.stack_tag === filterTag);

      return (
        <div className="max-w-7xl mx-auto p-6 space-y-6">
          {/* Top Enterprise Header Bar */}
          <header className="flex flex-wrap justify-between items-center bg-slate-900/80 backdrop-blur border border-slate-800/80 px-6 py-4 rounded-2xl shadow-xl gap-4">
            <div className="flex items-center gap-3">
              <div className="relative flex h-3.5 w-3.5">
                <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                <span className="relative inline-flex rounded-full h-3.5 w-3.5 bg-emerald-500"></span>
              </div>
              <div>
                <h1 className="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                  SentinelOps <span className="text-xs uppercase bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-full font-mono">AIOps Copilot v2.4</span>
                </h1>
                <p className="text-xs text-slate-400">Automated Linux Telemetry, Hybrid-RAG Synthesis & DevSecOps Compliance</p>
              </div>
            </div>

            <div className="flex items-center gap-3">
              <div className="hidden md:flex items-center gap-4 text-xs bg-slate-950/60 border border-slate-800 px-3.5 py-2 rounded-xl text-slate-300 font-mono">
                <span>🟢 API: Online</span>
                <span className="text-slate-600">|</span>
                <span>🧠 Model: <strong className="text-emerald-400">gpt-oss-20b</strong></span>
              </div>
              {result?.incident_id && (
                <a
                  href={`/api/export/${result.incident_id}`}
                  download={`SentinelOps_PostMortem_${result.incident_id}.md`}
                  className="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-lg shadow-emerald-900/20 transition flex items-center gap-1.5"
                >
                  📥 Export Post-Mortem (.md)
                </a>
              )}
            </div>
          </header>

          {/* Main Dashboard Grid */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            {/* Left Column: Log Simulator & Input */}
            <div className="lg:col-span-5 bg-slate-900/90 border border-slate-800/90 rounded-2xl p-5 shadow-xl flex flex-col justify-between">
              <div>
                <div className="flex justify-between items-center mb-3">
                  <span className="text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center gap-1.5">
                    ⚙️ 1. Linux Crash Simulator / Log Input
                  </span>
                  <select
                    value={stack}
                    onChange={(e) => setStack(e.target.value)}
                    className="bg-slate-950 border border-slate-700/80 rounded-lg px-2.5 py-1 text-xs text-slate-200 font-medium focus:outline-none focus:border-emerald-500"
                  >
                    <option value="All">All Stacks</option>
                    <option value="Linux">Linux / Systemd</option>
                    <option value="Nginx">Nginx Proxy</option>
                    <option value="Docker">Docker Engine</option>
                    <option value="Database">PostgreSQL</option>
                  </select>
                </div>

                <div className="grid grid-cols-2 gap-2 mb-3">
                  {PRESET_SIMULATIONS.map((sim, idx) => (
                    <button
                      key={idx}
                      onClick={() => { setRawLog(sim.log); setStack(sim.stack); }}
                      className="text-left text-xs bg-slate-950/70 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 rounded-xl p-2.5 text-slate-300 transition truncate shadow-sm font-medium"
                      title={sim.label}
                    >
                      ⚡ {sim.label}
                    </button>
                  ))}
                </div>

                <div className="relative">
                  <div className="absolute top-2 right-2 z-10">
                    <button
                      onClick={copyRawLog}
                      className="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded font-mono"
                    >
                      {logCopied ? "Copied!" : "Copy Log"}
                    </button>
                  </div>
                  <textarea
                    rows={10}
                    value={rawLog}
                    onChange={(e) => setRawLog(e.target.value)}
                    placeholder="Paste Linux /var/log/syslog, journalctl, or container crash trace..."
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 font-mono text-xs text-emerald-300 focus:outline-none focus:border-emerald-500 shadow-inner"
                  />
                </div>
              </div>

              <div className="flex gap-2.5 mt-4">
                <button
                  onClick={() => runDiagnosis("manual")}
                  disabled={loading}
                  className="flex-1 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white py-3 rounded-xl text-xs font-bold tracking-wide shadow-lg shadow-emerald-900/30 transition uppercase flex items-center justify-center gap-2"
                >
                  {loading ? (
                    <span className="flex items-center gap-2">
                      <svg className="animate-spin h-4 w-4 text-white" viewBox="0 0 24 24" fill="none"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
                      Analyzing Hybrid RAG...
                    </span>
                  ) : "🔍 Diagnose Terminal Log"}
                </button>
                <button
                  onClick={() => runDiagnosis("simulator")}
                  disabled={loading}
                  className="bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white px-4 py-3 rounded-xl text-xs font-bold tracking-wide shadow-lg shadow-indigo-900/30 transition uppercase"
                  title="Simulate Autonomous systemd Agent Webhook"
                >
                  🚀 Agent Alert
                </button>
              </div>
            </div>

            {/* Right Column: Diagnosis & RAG Output */}
            <div className="lg:col-span-7 bg-slate-900/90 border border-slate-800/90 rounded-2xl p-6 shadow-xl flex flex-col justify-between">
              {errorMsg && (
                <div className="bg-red-950/90 border border-red-500 text-red-200 p-4 rounded-xl text-xs font-semibold mb-4 shadow-md flex items-center gap-2">
                  <span>❌ API Error:</span> {errorMsg}
                </div>
              )}

              {!result ? (
                <div className="h-full flex flex-col items-center justify-center text-center py-20 text-slate-500 space-y-3">
                  <div className="h-14 w-14 rounded-2xl bg-slate-950 border border-slate-800 flex items-center justify-center text-emerald-400 text-2xl shadow-inner">
                    🛡️
                  </div>
                  <div>
                    <p className="text-sm font-semibold text-slate-300">SentinelOps Ready for Incident Triage</p>
                    <p className="text-xs text-slate-500 max-w-sm mt-1">Select a simulated Linux failure on the left or trigger the systemd collector agent to stream real-time AIOps diagnostics.</p>
                  </div>
                </div>
              ) : (
                <div className="space-y-5">
                  {result.diagnosis.risk_level === "HIGH_RISK" ? (
                    <div className="bg-red-950/90 border border-red-500 text-red-200 px-4 py-3 rounded-xl text-xs font-semibold shadow-md flex items-center justify-between">
                      <span>⚠️ HIGH-RISK COMMAND GUARDRAIL: Destructive command detected ({result.diagnosis.flagged_commands?.join(", ")}).</span>
                      <span className="bg-red-900 px-2 py-0.5 rounded text-[10px] uppercase">Manual Review Required</span>
                    </div>
                  ) : (
                    <div className="bg-emerald-950/40 border border-emerald-700/60 text-emerald-300 px-4 py-2.5 rounded-xl text-xs font-semibold flex justify-between items-center shadow-sm">
                      <span className="flex items-center gap-2">🛡️ Command Safety Guardrail: <strong className="text-emerald-400">SAFE</strong></span>
                      <span className="text-slate-400 text-[11px]">Noise Lines Filtered: <strong className="text-white">{result.noise_lines_dropped}</strong></span>
                    </div>
                  )}

                  <div className="space-y-1.5">
                    <div className="flex justify-between items-center text-xs font-bold uppercase tracking-wider text-slate-400">
                      <span>Sanitized Payload Sent to LLM</span>
                      <span className="text-amber-400 font-mono font-normal">
                        {Object.keys(result.redactions || {}).length > 0
                          ? `Redacted: ${JSON.stringify(result.redactions)}`
                          : "🔒 Zero PII/Secrets Exposed"}
                      </span>
                    </div>
                    <pre className="bg-slate-950 border border-slate-800/80 p-3 rounded-xl font-mono text-xs text-amber-300 overflow-x-auto shadow-inner">{result.sanitized_log}</pre>
                  </div>

                  <div className="space-y-1">
                    <span className="text-xs font-bold uppercase tracking-wider text-slate-400 block">🧠 Root Cause Analysis</span>
                    <p className="text-sm text-slate-200 leading-relaxed bg-slate-950/40 border border-slate-800/50 p-3.5 rounded-xl">{result.diagnosis.root_cause}</p>
                  </div>

                  <div className="space-y-1.5">
                    <div className="flex justify-between items-center">
                      <span className="text-xs font-bold uppercase tracking-wider text-slate-400">🛠️ Verified Remediation Commands</span>
                      <button
                        onClick={() => copyCommands(result.diagnosis.fix_commands || [])}
                        className="text-xs bg-slate-800 hover:bg-slate-700 text-emerald-400 px-3 py-1 rounded-lg font-medium transition shadow-sm"
                      >
                        {copied ? "✨ Copied to Clipboard!" : "📋 Copy Commands"}
                      </button>
                    </div>
                    <pre className="bg-slate-950 border border-slate-800/80 p-3.5 rounded-xl font-mono text-xs text-emerald-400 overflow-x-auto shadow-inner">
                      {(result.diagnosis.fix_commands || []).join("\n")}
                    </pre>
                  </div>

                  <div className="space-y-1.5 pt-1">
                    <span className="text-xs font-bold uppercase tracking-wider text-slate-400 block">📚 Grounded Knowledge Base Citations</span>
                    <div className="flex flex-wrap gap-2">
                      {(result.diagnosis.citations || []).map((c, idx) => (
                        <span key={idx} className="bg-cyan-950/60 border border-cyan-700/60 text-cyan-300 text-xs px-3 py-1.5 rounded-xl font-mono shadow-sm flex items-center gap-1.5">
                          <span>📌</span> {c}
                        </span>
                      ))}
                    </div>
                  </div>
                </div>
              )}
            </div>
          </div>

          {/* Bottom Persistent Incident Feed */}
          <div className="bg-slate-900/90 border border-slate-800/90 rounded-2xl p-6 shadow-xl space-y-4">
            <div className="flex flex-wrap justify-between items-center gap-4">
              <div>
                <h2 className="text-sm font-bold uppercase tracking-wider text-slate-200 flex items-center gap-2">
                  📊 Live Server Health & Webhook Incident Feed <span className="text-[10px] bg-indigo-500/10 text-indigo-400 border border-indigo-500/30 px-2 py-0.5 rounded-full font-mono">Neon PostgreSQL Persistent</span>
                </h2>
                <p className="text-xs text-slate-400 mt-0.5">All telemetry snapshots and AI post-mortems logged across cluster nodes.</p>
              </div>
              <div className="flex items-center gap-3">
                <select
                  value={filterTag}
                  onChange={(e) => setFilterTag(e.target.value)}
                  className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-300"
                >
                  <option value="All">Filter Stack: All</option>
                  <option value="Linux">Linux</option>
                  <option value="Nginx">Nginx</option>
                  <option value="Docker">Docker</option>
                  <option value="Database">Database</option>
                </select>
                <button onClick={fetchIncidents} className="text-xs bg-slate-800 hover:bg-slate-700 text-emerald-400 px-3 py-1.5 rounded-xl font-medium transition">
                  🔄 Refresh Feed
                </button>
              </div>
            </div>

            <div className="overflow-x-auto rounded-xl border border-slate-800/80">
              <table className="w-full text-left border-collapse text-xs">
                <thead>
                  <tr className="bg-slate-950/80 text-slate-400 border-b border-slate-800">
                    <th className="py-3 px-4 font-semibold">ID</th>
                    <th className="py-3 px-4 font-semibold">Node / Host</th>
                    <th className="py-3 px-4 font-semibold">Source</th>
                    <th className="py-3 px-4 font-semibold">Stack</th>
                    <th className="py-3 px-4 font-semibold">Telemetry (CPU / RAM / Disk)</th>
                    <th className="py-3 px-4 font-semibold">Safety</th>
                    <th className="py-3 px-4 font-semibold">Timestamp (UTC)</th>
                    <th className="py-3 px-4 font-semibold">Report</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800/60 bg-slate-900/40">
                  {filteredIncidents.map((inc) => (
                    <tr key={inc.id} className="hover:bg-slate-800/50 transition">
                      <td className="py-3 px-4 font-mono text-emerald-400 font-bold">#INC-{inc.id}</td>
                      <td className="py-3 px-4 font-mono text-slate-200">{inc.hostname}</td>
                      <td className="py-3 px-4">
                        <span className={`px-2.5 py-1 rounded-lg text-[11px] font-medium ${inc.source_type === "systemd-agent" ? "bg-indigo-950 text-indigo-300 border border-indigo-700/60" : "bg-slate-800 text-slate-300 border border-slate-700"}`}>
                          {inc.source_type}
                        </span>
                      </td>
                      <td className="py-3 px-4 text-slate-300 font-medium">{inc.stack_tag}</td>
                      <td className="py-3 px-4 font-mono text-slate-400">
                        {inc.cpu_load} | {inc.mem_used_pct}% | {inc.disk_used_pct}%
                      </td>
                      <td className="py-3 px-4">
                        <span className={`px-2.5 py-1 rounded-lg font-bold text-[11px] ${inc.risk_level === "HIGH_RISK" ? "bg-red-950 text-red-400 border border-red-800" : "bg-emerald-950 text-emerald-400 border border-emerald-800/60"}`}>
                          {inc.risk_level}
                        </span>
                      </td>
                      <td className="py-3 px-4 text-slate-400 font-mono text-[11px]">{inc.created_at}</td>
                      <td className="py-3 px-4">
                        <a href={`/api/export/${inc.id}`} download={`SentinelOps_Incident_${inc.id}.md`} className="text-cyan-400 hover:text-cyan-300 hover:underline font-medium flex items-center gap-1">
                          📄 .md
                        </a>
                      </td>
                    </tr>
                  ))}
                  {filteredIncidents.length === 0 && (
                    <tr><td colSpan="8" className="py-8 text-center text-slate-500 font-medium">No incident records found for this filter. Trigger a simulation or agent alert above.</td></tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
