<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SentinelOps | Enterprise AIOps & Linux Copilot</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11" integrity="sha384-A1XhMANHciQ8ED89Ap5K0zOdmQKiEeXSjaN0sakNxIzq9Z2YfXV/BwHp7oP3z5ip" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js" integrity="sha384-BcI7nduYchENm39cFMEVJXHEE7fwHONANyn/pY2YTa+BNtrWF2bKBZeI0wqVithi" crossorigin="anonymous"></script>
</head>
<body class="bg-[#080b12] text-slate-100 min-h-screen font-sans antialiased selection:bg-blue-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const PRESET_SIMULATIONS = [
      {
        label: "Nginx Port 80 Conflict (EADDRINUSE)",
        stack: "Nginx",
        log: "INFO: Health probe started from 10.12.4.88\nnginx: [emerg] bind() to 0.0.0.0:80 failed (98: Address already in use)\nsystemd[1]: nginx.service: Main process exited, code=exited, status=1/FAILURE"
      },
      {
        label: "Linux Kernel OOM-Killer (Exit Code 137)",
        stack: "Linux",
        log: "DEBUG: GC pause 140ms\nkernel: [48219.112] Out of memory: Killed process 2194 (java) total-vm:2412904kB, anon-rss:912400kB\nDATABASE_URL=postgresql://user:<REDACTED>@db.example.invalid:5432/app"
      },
      {
        label: "Disk Exhaustion (/var/log ENOSPC)",
        stack: "Linux",
        log: "INFO: Log rotation check\nsystemd-journald[412]: Failed to write entry (28: No space left on device) - /var/log partition at 100%"
      },
      {
        label: "Docker Socket Permission Denied",
        stack: "Docker",
        log: "Got permission denied while trying to connect to the Docker daemon socket at unix:///var/run/docker.sock"
      }
    ];

    function App() {
      const [rawLog, setRawLog] = useState(PRESET_SIMULATIONS[0].log);
      const [stack, setStack] = useState("All");
      const [result, setResult] = useState(null);
      const [incidents, setIncidents] = useState([]);
      const [loading, setLoading] = useState(false);
      const [runbookFile, setRunbookFile] = useState(null);
      const [runbookMessage, setRunbookMessage] = useState("");
      const [remediatingIncidentId, setRemediatingIncidentId] = useState(null);
      const [diagnosingIncidentId, setDiagnosingIncidentId] = useState(null);
      const [updatingIncidentStatusId, setUpdatingIncidentStatusId] = useState(null);
      const [diagnosticResults, setDiagnosticResults] = useState({});
      const [remediationResults, setRemediationResults] = useState({});
      const [remediationAuditHistory, setRemediationAuditHistory] = useState({});
      const [loadingAuditIncidentId, setLoadingAuditIncidentId] = useState(null);
      const [selectedIncidentId, setSelectedIncidentId] = useState(null);
      const [copied, setCopied] = useState(false);
      const [logCopied, setLogCopied] = useState(false);
      const [errorMsg, setErrorMsg] = useState(null);
      const [filterTag, setFilterTag] = useState("All");
      const [activeTab, setActiveTab] = useState("alerts");
      const [authState, setAuthState] = useState({ checking: true, configured: true, authenticated: false });
      const [loginPassword, setLoginPassword] = useState("");
      const [loginError, setLoginError] = useState("");

      const fetchIncidents = async (sourceType = null) => {
        try {
          const sourceFilter = sourceType ? `?source_type=${encodeURIComponent(sourceType)}` : "";
          const res = await fetch(`/api/incidents${sourceFilter}`);
          if (res.status === 401) {
            setLoginError("Admin session expired. Sign in again.");
            setAuthState((current) => ({ ...current, authenticated: false }));
            setIncidents([]);
            return;
          }
          if (!res.ok) throw new Error(`Unable to load incidents (HTTP ${res.status})`);
          setIncidents(await res.json());
        } catch (error) {
          setErrorMsg(error.message);
        }
      };

      const fetchRemediationAudit = async (incidentId) => {
        setLoadingAuditIncidentId(incidentId);
        try {
          const res = await fetch(`/api/incidents/${incidentId}/remediation-audit`, {
            credentials: "same-origin"
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || `Unable to load remediation history (HTTP ${res.status})`);
          setRemediationAuditHistory((current) => ({ ...current, [incidentId]: data }));
        } catch (error) {
          setErrorMsg(error.message);
        } finally {
          setLoadingAuditIncidentId(null);
        }
      };

      useEffect(() => {
        let active = true;
        fetch("/api/auth/status", { credentials: "same-origin", cache: "no-store" })
          .then(async (res) => {
            if (!res.ok) throw new Error(`Unable to check admin session (HTTP ${res.status})`);
            return res.json();
          })
          .then((status) => {
            if (active) {
              setAuthState({ checking: false, configured: status.configured, authenticated: status.authenticated });
            }
          })
          .catch(() => {
            if (active) {
              setLoginError("Unable to contact the admin service. Reload the page and retry.");
              setAuthState({ checking: false, configured: false, authenticated: false });
            }
          });
        return () => { active = false; };
      }, []);

      useEffect(() => {
        if (authState.authenticated && selectedIncidentId !== null) {
          fetchRemediationAudit(selectedIncidentId);
        }
      }, [authState.authenticated, selectedIncidentId]);

      useEffect(() => {
        if (!authState.authenticated) {
          setIncidents([]);
          return;
        }
        const sourceType = activeTab === "vm-logs" ? "systemd-agent" : null;
        fetchIncidents(sourceType);
        const timer = setInterval(() => fetchIncidents(sourceType), 10000);
        return () => clearInterval(timer);
      }, [authState.authenticated, activeTab]);

      const handleLogin = async (event) => {
        event.preventDefault();
        setLoginError("");
        try {
          const res = await fetch("/api/auth/login", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password: loginPassword })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "Unable to sign in");
          setLoginPassword("");
          setAuthState({ checking: false, configured: true, authenticated: true });
        } catch (error) {
          setLoginError(error.message);
        }
      };

      const handleLogout = async () => {
        try {
          const res = await fetch("/api/auth/logout", { method: "POST", credentials: "same-origin" });
          if (!res.ok) throw new Error(`Unable to sign out (HTTP ${res.status})`);
        } catch (error) {
          setLoginError(error.message);
        } finally {
          setAuthState({ checking: false, configured: true, authenticated: false });
          setIncidents([]);
          setResult(null);
        }
      };

      const runDiagnosis = async (sourceType = "manual") => {
        if (!rawLog.trim()) return;
        setLoading(true);
        setErrorMsg(null);
        try {
          const res = await fetch("/api/diagnose", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              raw_log: rawLog,
              stack_filter: stack,
              hostname: sourceType === "simulator" ? "ubuntu-cloud-vm-01" : "sysadmin-console",
              source_type: sourceType
            })
          });
          const data = await res.json();
          if (res.status === 401) {
            setLoginError("Admin session expired. Sign in again.");
            setAuthState((current) => ({ ...current, authenticated: false }));
          }
          if (!res.ok) {
            throw new Error(data.detail || JSON.stringify(data) || "Server error");
          }
          setResult(data);
          fetchIncidents();
        } catch (err) {
          setErrorMsg(err.message);
        } finally {
          setLoading(false);
        }
      };

      const copyCommands = (cmds) => {
        navigator.clipboard.writeText(cmds.join("\n"));
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      const copyRawLog = () => {
        navigator.clipboard.writeText(rawLog);
        setLogCopied(true);
        setTimeout(() => setLogCopied(false), 2000);
      };

      const handleRunbookUpload = async (event) => {
        event.preventDefault();
        if (!runbookFile) return;
        setRunbookMessage("");
        const formData = new FormData();
        formData.append("file", runbookFile);
        try {
          const res = await fetch("/api/runbooks/upload", {
            method: "POST",
            credentials: "same-origin",
            body: formData
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "Unable to upload runbook");
          setRunbookMessage(`Indexed ${data.filename} (${data.total_chunks} chunks).`);
          setRunbookFile(null);
          event.target.reset();
        } catch (error) {
          setRunbookMessage(error.message);
        }
      };

      const handleRemediate = async (incident) => {
        const commands = incident.fix_commands || [];
        if (!commands.length) return;
        const diagnostics = diagnosticResults[incident.id] || incident.diagnostic_report;
        if (!diagnostics || !diagnostics.run_id || !["COMPLETED", "SIMULATION_ONLY"].includes(diagnostics.status)) {
          setErrorMsg("Run successful read-only diagnostics before approving fixes.");
          return;
        }
        const approvalMessage = [
          `Admin approval required for incident #${incident.id} on ${incident.hostname}.`,
          "Review the recorded read-only diagnostic output before proceeding.",
          "Review and approve these exact proposed commands:",
          ...commands.map((command) => `- ${command}`),
          "",
          "Proceed? Live execution only occurs if SSH remediation is enabled and all allowlists pass."
        ].join("\n");
        if (!window.confirm(approvalMessage)) return;
        setRemediatingIncidentId(incident.id);
        setErrorMsg(null);
        try {
          const res = await fetch(`/api/remediate/${incident.id}`, {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ approved: true, diagnostic_run_id: diagnostics.run_id })
          });
          const data = await res.json();
          if (!res.ok) {
            const detail = data.detail || `Remediation failed (HTTP ${res.status})`;
            await fetchRemediationAudit(incident.id);
            throw new Error(detail);
          }
          await fetchRemediationAudit(incident.id);
          const result = {
            ...data.remediation,
            post_check: data.post_check,
            approved_at: data.approved_at,
            approved_by: data.approved_by
          };
          setRemediationResults((current) => ({ ...current, [incident.id]: result }));
          setIncidents((current) => current.map((item) =>
            item.id === incident.id
              ? {
                  ...item,
                  remediation_report: data.remediation,
                  post_check_report: data.post_check,
                  remediation_approved_at: data.approved_at,
                  remediation_approved_by: data.approved_by,
                  status: data.post_check.status === "HEALTHY" ? "COMPLETED" : item.status
                }
              : item
          ));
        } catch (error) {
          setErrorMsg(error.message);
        } finally {
          setRemediatingIncidentId(null);
        }
      };

      const handleDiagnostics = async (incident) => {
        setDiagnosingIncidentId(incident.id);
        setErrorMsg(null);
        try {
          const res = await fetch(`/api/incidents/${incident.id}/diagnose`, {
            method: "POST",
            credentials: "same-origin"
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || `Diagnostics failed (HTTP ${res.status})`);
          setDiagnosticResults((current) => ({ ...current, [incident.id]: data.diagnostics }));
          setIncidents((current) => current.map((item) =>
            item.id === incident.id ? { ...item, diagnostic_report: data.diagnostics } : item
          ));
        } catch (error) {
          setErrorMsg(error.message);
        } finally {
          setDiagnosingIncidentId(null);
        }
      };

      const handleIncidentStatusChange = async (incidentId, status) => {
        setUpdatingIncidentStatusId(incidentId);
        setErrorMsg(null);
        try {
          const res = await fetch(`/api/incidents/${incidentId}/status`, {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ status })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || `Unable to update incident status (HTTP ${res.status})`);
          setIncidents((current) => current.map((incident) =>
            incident.id === incidentId ? { ...incident, status: data.status } : incident
          ));
        } catch (error) {
          setErrorMsg(error.message);
          await fetchIncidents();
        } finally {
          setUpdatingIncidentStatusId(null);
        }
      };

      const filteredIncidents = incidents.filter(inc => filterTag === "All" || inc.stack_tag === filterTag);
      const visibleIncidents = activeTab === "vm-logs"
        ? incidents.filter((incident) => incident.source_type === "systemd-agent")
        : filteredIncidents;
      const selectedIncident = incidents.find((incident) => incident.id === selectedIncidentId);
      const renderIncidentStatus = (inc) => (
        <select
          aria-label={`Resolution status for incident ${inc.id}`}
          value={inc.status || "PENDING"}
          onChange={(event) => handleIncidentStatusChange(inc.id, event.target.value)}
          disabled={updatingIncidentStatusId === inc.id}
          className={`w-full min-w-0 max-w-full rounded-md border px-1 py-1 text-[9px] font-medium disabled:opacity-50 sm:text-[10px] ${
            inc.status === "COMPLETED"
              ? "border-emerald-700/70 bg-emerald-950/50 text-emerald-200"
              : "border-amber-700/70 bg-amber-950/40 text-amber-200"
          }`}
        >
          <option value="PENDING">Pending</option>
          <option value="COMPLETED">Completed</option>
        </select>
      );
      const renderIncidentActions = (inc) => (
        <div className="flex flex-wrap items-center gap-x-3 gap-y-1">
          <button
            type="button"
            onClick={() => setSelectedIncidentId(inc.id)}
            className="text-left font-medium text-cyan-300 hover:text-cyan-200 hover:underline"
          >
            View details
          </button>
          <a href={`/api/export/${inc.id}`} download={`SentinelOps_Incident_${inc.id}.md`} className="font-medium text-blue-300 hover:text-blue-200 hover:underline">
            ↓ Report
          </a>
        </div>
      );

      if (authState.checking) {
        return <div className="flex min-h-screen items-center justify-center bg-[#080b12] text-sm text-slate-300">Checking admin session...</div>;
      }

      if (!authState.configured) {
        return (
          <div className="flex min-h-screen items-center justify-center bg-[#080b12] p-5 text-slate-100">
            <section className="w-full max-w-md rounded-2xl border border-slate-800 bg-[#111722] p-7 shadow-2xl">
              <h1 className="text-xl font-semibold">Admin login unavailable</h1>
              <p className="mt-3 text-sm text-slate-400">{loginError || "Configure a strong ADMIN_PASSWORD and a random SESSION_SECRET of at least 32 characters on the server."}</p>
            </section>
          </div>
        );
      }

      if (!authState.authenticated) {
        return (
          <div className="flex min-h-screen items-center justify-center bg-[#080b12] p-5 text-slate-100">
            <section className="w-full max-w-md rounded-2xl border border-slate-800 bg-[#111722] p-7 shadow-2xl">
              <div className="mb-6 flex items-center gap-3">
                <span className="flex h-9 w-9 items-center justify-center rounded-lg border border-blue-300/30 bg-blue-400/15 text-lg text-blue-200">∿</span>
                <div>
                  <h1 className="text-lg font-semibold">SentinelOps</h1>
                  <p className="text-xs text-slate-400">Admin sign in</p>
                </div>
              </div>
              <form onSubmit={handleLogin} className="space-y-4">
                <label htmlFor="admin-password" className="block text-xs font-medium text-slate-300">Admin password</label>
                <input
                  id="admin-password"
                  type="password"
                  autoComplete="current-password"
                  required
                  value={loginPassword}
                  onChange={(event) => setLoginPassword(event.target.value)}
                  className="w-full rounded-xl border border-slate-700 bg-[#0a111c] px-4 py-3 text-sm text-slate-100 focus:border-blue-500 focus:outline-none"
                />
                {loginError && <p role="alert" className="text-sm text-red-300">{loginError}</p>}
                <button type="submit" className="w-full rounded-xl bg-blue-600 px-4 py-3 text-sm font-medium text-white transition hover:bg-blue-500">Sign in</button>
              </form>
            </section>
          </div>
        );
      }

      return (
        <div
          className="min-h-screen p-3 sm:p-5 lg:p-8"
          style={{ background: "radial-gradient(ellipse at 18% 0%, #a9c8ff 0%, #4e8df0 38%, #080b12 82%)" }}
        >
          <div className="mx-auto grid min-h-[calc(100vh-2rem)] max-w-[1500px] grid-cols-1 overflow-clip rounded-2xl border border-slate-700/70 bg-[#080d17] shadow-2xl shadow-black/40 md:grid-cols-[218px_minmax(0,1fr)]">
            <aside className="flex flex-col border-b border-slate-800 bg-[#111722] md:border-b-0 md:border-r">
              <div className="flex items-center gap-3 border-b border-slate-800 px-5 py-5">
                <span className="flex h-9 w-9 items-center justify-center rounded-lg border border-blue-300/30 bg-blue-400/15 text-lg text-blue-200">∿</span>
                <div>
                  <div className="text-sm font-semibold text-slate-100">SentinelOps</div>
                  <div className="text-[10px] tracking-wide text-slate-400">Linux AI Monitoring</div>
                </div>
              </div>
              <nav aria-label="Main navigation" className="grid grid-cols-2 gap-2 p-3 md:flex md:flex-1 md:flex-col">
                <button
                  type="button"
                  onClick={() => setActiveTab("alerts")}
                  className={`rounded-lg border px-3 py-2.5 text-left text-xs font-medium transition ${activeTab === "alerts" ? "border-blue-400/20 bg-blue-600/30 text-blue-100" : "border-transparent text-slate-400 hover:bg-slate-800 hover:text-slate-200"}`}
                >
                  ⚠ &nbsp; Alerts
                </button>
                <button
                  type="button"
                  onClick={() => setActiveTab("troubleshoot")}
                  className={`rounded-lg border px-3 py-2.5 text-left text-xs font-medium transition ${activeTab === "troubleshoot" ? "border-blue-400/20 bg-blue-600/30 text-blue-100" : "border-transparent text-slate-400 hover:bg-slate-800 hover:text-slate-200"}`}
                >
                  ⌁ &nbsp; Manual Logs
                </button>
                <button
                  type="button"
                  onClick={() => setActiveTab("vm-logs")}
                  className={`rounded-lg border px-3 py-2.5 text-left text-xs font-medium transition ${activeTab === "vm-logs" ? "border-blue-400/20 bg-blue-600/30 text-blue-100" : "border-transparent text-slate-400 hover:bg-slate-800 hover:text-slate-200"}`}
                >
                  ◉ &nbsp; VM Agent Logs
                </button>
                <button
                  type="button"
                  onClick={() => setActiveTab("runbooks")}
                  className={`rounded-lg border px-3 py-2.5 text-left text-xs font-medium transition ${activeTab === "runbooks" ? "border-blue-400/20 bg-blue-600/30 text-blue-100" : "border-transparent text-slate-400 hover:bg-slate-800 hover:text-slate-200"}`}
                >
                  📚 &nbsp; Runbooks
                </button>
              </nav>
              <div className="hidden border-t border-slate-800 px-5 py-4 text-xs text-slate-500 md:block">◉ &nbsp; Local Runner</div>
            </aside>

            <main className="flex w-full min-w-0 flex-col gap-5 p-4 sm:p-6 lg:p-8">
              <header className="flex flex-wrap items-end justify-between gap-4">
                <div>
                  <h1 className="text-xl font-semibold tracking-tight text-slate-100">
                    {activeTab === "alerts"
                      ? "System Alerts"
                      : activeTab === "troubleshoot"
                        ? "Manual Log Diagnosis"
                        : activeTab === "vm-logs"
                          ? "VM Agent Logs"
                          : "Runbook Management"}
                  </h1>
                  <p className="mt-1 text-xs text-slate-400">
                    {activeTab === "alerts"
                      ? "Real-time monitoring and incident management"
                      : activeTab === "troubleshoot"
                        ? "Paste a log or select a sample to run a manual diagnosis"
                        : activeTab === "vm-logs"
                          ? "Automatically received incidents from connected Linux VM collectors"
                          : "Upload Markdown runbooks to the diagnosis knowledge base"}
                  </p>
                </div>
                <div className="flex items-center gap-2">
                  {result?.incident_id && (
                    <a
                      href={`/api/export/${result.incident_id}`}
                      download={`SentinelOps_PostMortem_${result.incident_id}.md`}
                      className="rounded-full border border-slate-700 bg-[#111824] px-3.5 py-2 text-xs text-slate-300 transition hover:bg-slate-800"
                    >
                      ↓ &nbsp; Export
                    </a>
                  )}
                  <button onClick={handleLogout} className="rounded-full border border-slate-700 bg-[#111824] px-3.5 py-2 text-xs text-slate-300 transition hover:bg-slate-800">
                    Sign out
                  </button>
                </div>
              </header>

              {errorMsg && activeTab !== "troubleshoot" && (
                <div role="alert" className="rounded-xl border border-red-500 bg-red-950/90 p-3 text-xs font-semibold text-red-200">
                  API Error: {errorMsg}
                </div>
              )}

              {activeTab === "alerts" && (
              <section aria-label="Incident summary" className="grid grid-cols-1 gap-3 sm:grid-cols-2 md:grid-cols-4">
                <div className="rounded-2xl border border-slate-800 bg-[#0d1420] p-4 shadow-lg">
                  <div className="flex items-center whitespace-nowrap text-[11px] text-slate-400"><span>◉ &nbsp; Total Alerts</span></div>
                  <div className="mt-3 rounded-xl border border-slate-800 bg-gradient-to-r from-blue-500/20 to-transparent px-2.5 py-2">
                    <div className="text-2xl font-light text-slate-100">{incidents.length.toString().padStart(2, "0")}</div>
                    <div className="mt-1 flex items-center gap-1.5 whitespace-nowrap text-[9px] text-slate-400"><span className="rounded-full bg-emerald-950 px-1.5 py-0.5 text-emerald-400">Live</span>Stored incidents</div>
                  </div>
                </div>
                <div className="rounded-2xl border border-slate-800 bg-[#0d1420] p-4 shadow-lg">
                  <div className="flex items-center whitespace-nowrap text-[11px] text-slate-400"><span>⌁ &nbsp; Critical Issues</span></div>
                  <div className="mt-3 rounded-xl border border-slate-800 bg-gradient-to-r from-blue-500/20 to-transparent px-2.5 py-2">
                    <div className="text-2xl font-light text-slate-100">{incidents.filter(inc => inc.risk_level === "HIGH_RISK").length.toString().padStart(2, "0")}</div>
                    <div className="mt-1 flex items-center gap-1.5 whitespace-nowrap text-[9px] text-slate-400"><span className="rounded-full bg-red-950 px-1.5 py-0.5 text-red-400">Review</span>High-risk findings</div>
                  </div>
                </div>
                <div className="rounded-2xl border border-slate-800 bg-[#0d1420] p-4 shadow-lg">
                  <div className="flex items-center whitespace-nowrap text-[11px] text-slate-400"><span>ϟ &nbsp; Safe Diagnoses</span></div>
                  <div className="mt-3 rounded-xl border border-slate-800 bg-gradient-to-r from-blue-500/20 to-transparent px-2.5 py-2">

                        {diagnosingIncidentId === selectedIncident.id ? "Checking..." : "Run Read-only Diagnostics"}
                      </button>
                      {(diagnosticResults[selectedIncident.id] || selectedIncident.diagnostic_report) && (
                        <span className="text-xs text-slate-400">
                          {(diagnosticResults[selectedIncident.id] || selectedIncident.diagnostic_report).status}
                        </span>
                      )}
                    </div>
                    {(diagnosticResults[selectedIncident.id] || selectedIncident.diagnostic_report) && (
                      <pre className="mt-2 max-h-48 overflow-auto whitespace-pre-wrap rounded-lg bg-[#080d17] p-3 font-mono text-xs text-slate-300">
                        {JSON.stringify((diagnosticResults[selectedIncident.id] || selectedIncident.diagnostic_report).outputs || [], null, 2)}
                      </pre>
                    )}
                  </section>
                  <section>
                    <h3 className="text-xs font-semibold uppercase tracking-wide text-slate-400">Proposed fix commands</h3>
                    <pre className="mt-2 overflow-auto whitespace-pre-wrap rounded-lg bg-[#080d17] p-3 font-mono text-xs text-blue-200">{(selectedIncident.fix_commands || []).join("\n") || "No fix commands were stored."}</pre>
                  </section>
                  <section>
                    <h3 className="text-xs font-semibold uppercase tracking-wide text-slate-400">Runbook citations</h3>
                    <ul className="mt-2 list-inside list-disc space-y-1 text-xs text-cyan-200">
                      {(selectedIncident.citations || []).map((citation, index) => <li key={index}>{citation}</li>)}
                      {(!selectedIncident.citations || selectedIncident.citations.length === 0) && <li>No citations were stored.</li>}
                    </ul>
                  </section>

                  {remediationResults[selectedIncident.id] && (
                    <section>
                      <h3 className="text-xs font-semibold uppercase tracking-wide text-slate-400">Remediation result</h3>
                      <p className="mt-2 text-sm text-slate-200">{remediationResults[selectedIncident.id].status}</p>
                      <p className="mt-1 text-xs text-slate-400">Approved by {remediationResults[selectedIncident.id].approved_by} at {remediationResults[selectedIncident.id].approved_at}</p>
                      {remediationResults[selectedIncident.id].reason && <p className="mt-1 text-xs text-amber-200">{remediationResults[selectedIncident.id].reason}</p>}
                      <pre className="mt-2 max-h-48 overflow-auto whitespace-pre-wrap rounded-lg bg-[#080d17] p-3 font-mono text-xs text-slate-300">{JSON.stringify(remediationResults[selectedIncident.id].outputs || [], null, 2)}</pre>
                      <p className="mt-2 text-xs text-slate-300">Post-fix health: {remediationResults[selectedIncident.id].post_check?.status || selectedIncident.post_check_report?.status || "Not run"}</p>
                    </section>
                  )}
                  {!remediationResults[selectedIncident.id] && selectedIncident.remediation_report && (
                    <section>
                      <h3 className="text-xs font-semibold uppercase tracking-wide text-slate-400">Remediation audit</h3>
                      <p className="mt-2 text-sm text-slate-200">{selectedIncident.remediation_report.status}</p>
                      <p className="mt-1 text-xs text-slate-400">Approved by {selectedIncident.remediation_approved_by} at {selectedIncident.remediation_approved_at}</p>
                      <pre className="mt-2 max-h-48 overflow-auto whitespace-pre-wrap rounded-lg bg-[#080d17] p-3 font-mono text-xs text-slate-300">{JSON.stringify(selectedIncident.remediation_report.outputs || [], null, 2)}</pre>
                      <p className="mt-2 text-xs text-slate-300">Post-fix health: {selectedIncident.post_check_report?.status || "Not run"}</p>
                    </section>
                  )}

                  <section>
                    <h3 className="text-xs font-semibold uppercase tracking-wide text-slate-400">Remediation attempt history</h3>
                    {loadingAuditIncidentId === selectedIncident.id && (
                      <p className="mt-2 text-xs text-slate-400">Loading audit history...</p>
                    )}
                    {(remediationAuditHistory[selectedIncident.id] || []).length === 0 &&
                      loadingAuditIncidentId !== selectedIncident.id && (
                        <p className="mt-2 text-xs text-slate-500">No remediation attempts recorded.</p>
                      )}
                    <div className="mt-2 space-y-2">
                      {(remediationAuditHistory[selectedIncident.id] || []).map((entry) => (
                        <details key={entry.id} className="rounded-lg border border-slate-800 bg-[#080d17] p-3">
                          <summary className="cursor-pointer text-xs text-slate-200">
                            Attempt #{entry.id} · {entry.outcome} · {entry.created_at}
                          </summary>
                          <p className="mt-2 whitespace-pre-wrap text-xs text-slate-400">
                            Commands: {(entry.commands || []).join("\n") || "None"}
                          </p>
                          <p className="mt-1 text-xs text-slate-400">
                            Verification: {entry.verification_report?.status || "Not run"}
                          </p>
                          <pre className="mt-2 max-h-48 overflow-auto whitespace-pre-wrap rounded-lg bg-[#0d1420] p-3 font-mono text-xs text-slate-300">
                            {JSON.stringify({
                              execution: entry.execution_report,
                              verification: entry.verification_report
                            }, null, 2)}
                          </pre>
                        </details>
                      ))}
                    </div>
                  </section>

                  {(selectedIncident.fix_commands || []).length > 0 && (
                    <section className="flex flex-wrap items-center justify-between gap-3 rounded-xl border border-amber-700/50 bg-amber-950/20 p-4">
                      <p className="max-w-xl text-xs leading-relaxed text-amber-100">
                        The VM agent only reports and diagnoses incidents. Fix commands never run automatically; an authenticated admin must approve them here.
                      </p>
                      <button
                        type="button"
                        onClick={() => handleRemediate(selectedIncident)}
                        disabled={
                          remediatingIncidentId === selectedIncident.id ||
                          !["COMPLETED", "SIMULATION_ONLY"].includes(
                            (diagnosticResults[selectedIncident.id] || selectedIncident.diagnostic_report)?.status
                          )
                        }
                        className="rounded-lg border border-amber-600/70 bg-amber-900/50 px-4 py-2 text-xs font-semibold text-amber-100 hover:bg-amber-800/60 disabled:opacity-50"
                      >
                        {remediatingIncidentId === selectedIncident.id ? "Running..." : "Approve & Run Fixes"}
                      </button>
                    </section>
                  )}
                </div>
              </section>
            </div>
          )}

          </main>
        </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
