<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SentinelOps | Enterprise AIOps & Linux Copilot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#080b12] text-slate-100 min-h-screen font-sans antialiased selection:bg-blue-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const PRESET_SIMULATIONS = [
      {
        label: "Nginx Port 80 Conflict (EADDRINUSE)",
        stack: "Nginx",
        log: "INFO: Health probe started from 10.12.4.88\nnginx: [emerg] bind() to 0.0.0.0:80 failed (98: Address already in use)\nsystemd[1]: nginx.service: Main process exited, code=exited, status=1/FAILURE"
      },
      {
        label: "Linux Kernel OOM-Killer (Exit Code 137)",
        stack: "Linux",
        log: "DEBUG: GC pause 140ms\nkernel: [48219.112] Out of memory: Killed process 2194 (java) total-vm:2412904kB, anon-rss:912400kB\nDATABASE_URL=postgresql://admin:SuperSecretPass99@10.0.1.50:5432/prod"
      },
      {
        label: "Disk Exhaustion (/var/log ENOSPC)",
        stack: "Linux",
        log: "INFO: Log rotation check\nsystemd-journald[412]: Failed to write entry (28: No space left on device) - /var/log partition at 100%"
      },
      {
        label: "Docker Socket Permission Denied",
        stack: "Docker",
        log: "Got permission denied while trying to connect to the Docker daemon socket at unix:///var/run/docker.sock"
      }
    ];

    function App() {
      const [rawLog, setRawLog] = useState(PRESET_SIMULATIONS[0].log);
      const [stack, setStack] = useState("All");
      const [result, setResult] = useState(null);
      const [incidents, setIncidents] = useState([]);
      const [loading, setLoading] = useState(false);
      const [copied, setCopied] = useState(false);
      const [logCopied, setLogCopied] = useState(false);
      const [errorMsg, setErrorMsg] = useState(null);
      const [filterTag, setFilterTag] = useState("All");
      const [activeTab, setActiveTab] = useState("alerts");

      const fetchIncidents = async () => {
        try {
          const res = await fetch("/api/incidents?limit=15");
          if (res.ok) setIncidents(await res.json());
        } catch (e) {}
      };

      useEffect(() => {
        fetchIncidents();
        const timer = setInterval(fetchIncidents, 10000);
        return () => clearInterval(timer);
      }, []);

      const runDiagnosis = async (sourceType = "manual") => {
        if (!rawLog.trim()) return;
        setLoading(true);
        setErrorMsg(null);
        try {
          const res = await fetch("/api/diagnose", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              raw_log: rawLog,
              stack_filter: stack,
              hostname: sourceType === "simulator" ? "ubuntu-cloud-vm-01" : "sysadmin-console",
              source_type: sourceType
            })
          });
          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.detail || JSON.stringify(data) || "Server error");
          }
          setResult(data);
          fetchIncidents();
        } catch (err) {
          setErrorMsg(err.message);
        } finally {
          setLoading(false);
        }
      };

      const copyCommands = (cmds) => {
        navigator.clipboard.writeText(cmds.join("\n"));
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      const copyRawLog = () => {
        navigator.clipboard.writeText(rawLog);
        setLogCopied(true);
        setTimeout(() => setLogCopied(false), 2000);
      };

      const filteredIncidents = incidents.filter(inc => filterTag === "All" || inc.stack_tag === filterTag);

      return (
        <div
          className="min-h-screen p-3 sm:p-5 lg:p-8"
          style={{ background: "radial-gradient(ellipse at 18% 0%, #a9c8ff 0%, #4e8df0 38%, #080b12 82%)" }}
        >
          <div className="mx-auto grid min-h-[calc(100vh-2rem)] max-w-[1500px] grid-cols-1 overflow-hidden rounded-2xl border border-slate-700/70 bg-[#080d17] shadow-2xl shadow-black/40 md:grid-cols-[218px_minmax(0,1fr)]">
            <aside className="flex flex-col border-b border-slate-800 bg-[#111722] md:border-b-0 md:border-r">
              <div className="flex items-center gap-3 border-b border-slate-800 px-5 py-5">
                <span className="flex h-9 w-9 items-center justify-center rounded-lg border border-blue-300/30 bg-blue-400/15 text-lg text-blue-200">∿</span>
                <div>
                  <div className="text-sm font-semibold text-slate-100">SentinelOps</div>
                  <div className="text-[10px] tracking-wide text-slate-400">Linux AI Monitoring</div>
                </div>
              </div>
              <nav aria-label="Main navigation" className="grid grid-cols-2 gap-2 p-3 md:flex md:flex-1 md:flex-col">
                <button
                  type="button"
                  onClick={() => setActiveTab("alerts")}
                  className={`rounded-lg border px-3 py-2.5 text-left text-xs font-medium transition ${activeTab === "alerts" ? "border-blue-400/20 bg-blue-600/30 text-blue-100" : "border-transparent text-slate-400 hover:bg-slate-800 hover:text-slate-200"}`}
                >
                  ⚠ &nbsp; Alerts
                </button>
                <button
                  type="button"
                  onClick={() => setActiveTab("troubleshoot")}
                  className={`rounded-lg border px-3 py-2.5 text-left text-xs font-medium transition ${activeTab === "troubleshoot" ? "border-blue-400/20 bg-blue-600/30 text-blue-100" : "border-transparent text-slate-400 hover:bg-slate-800 hover:text-slate-200"}`}
                >
                  ⌁ &nbsp; Log Troubleshooting
                </button>
              </nav>
              <div className="hidden border-t border-slate-800 px-5 py-4 text-xs text-slate-500 md:block">◉ &nbsp; Local Runner</div>
            </aside>

            <main className="mx-auto flex min-w-0 max-w-[1180px] flex-col gap-5 p-4 sm:p-6 lg:p-8">
              <header className="flex flex-wrap items-end justify-between gap-4">
                <div>
                  <h1 className="text-xl font-semibold tracking-tight text-slate-100">{activeTab === "alerts" ? "System Alerts" : "Log Troubleshooting"}</h1>
                  <p className="mt-1 text-xs text-slate-400">
                    {activeTab === "alerts" ? "Real-time monitoring and incident management" : "Analyze Linux logs and review diagnosis results"}
                  </p>
                </div>
                <div className="flex items-center gap-2">
                  {result?.incident_id && (
                    <a
                      href={`/api/export/${result.incident_id}`}
                      download={`SentinelOps_PostMortem_${result.incident_id}.md`}
                      className="rounded-full border border-slate-700 bg-[#111824] px-3.5 py-2 text-xs text-slate-300 transition hover:bg-slate-800"
                    >
                      ↓ &nbsp; Export
                    </a>
                  )}
                </div>
              </header>

              {activeTab === "alerts" && (
              <section aria-label="Incident summary" className="grid grid-cols-1 gap-3 sm:grid-cols-2 md:grid-cols-4">
                <div className="rounded-2xl border border-slate-800 bg-[#0d1420] p-4 shadow-lg">
                  <div className="flex items-center whitespace-nowrap text-[11px] text-slate-400"><span>◉ &nbsp; Total Alerts</span></div>
                  <div className="mt-3 rounded-xl border border-slate-800 bg-gradient-to-r from-blue-500/20 to-transparent px-2.5 py-2">
                    <div className="text-2xl font-light text-slate-100">{incidents.length.toString().padStart(2, "0")}</div>
                    <div className="mt-1 flex items-center gap-1.5 whitespace-nowrap text-[9px] text-slate-400"><span className="rounded-full bg-emerald-950 px-1.5 py-0.5 text-emerald-400">Live</span>Stored incidents</div>
                  </div>
                </div>
                <div className="rounded-2xl border border-slate-800 bg-[#0d1420] p-4 shadow-lg">
                  <div className="flex items-center whitespace-nowrap text-[11px] text-slate-400"><span>⌁ &nbsp; Critical Issues</span></div>
                  <div className="mt-3 rounded-xl border border-slate-800 bg-gradient-to-r from-blue-500/20 to-transparent px-2.5 py-2">
                    <div className="text-2xl font-light text-slate-100">{incidents.filter(inc => inc.risk_level === "HIGH_RISK").length.toString().padStart(2, "0")}</div>
                    <div className="mt-1 flex items-center gap-1.5 whitespace-nowrap text-[9px] text-slate-400"><span className="rounded-full bg-red-950 px-1.5 py-0.5 text-red-400">Review</span>High-risk findings</div>
                  </div>
                </div>
                <div className="rounded-2xl border border-slate-800 bg-[#0d1420] p-4 shadow-lg">
                  <div className="flex items-center whitespace-nowrap text-[11px] text-slate-400"><span>ϟ &nbsp; Safe Diagnoses</span></div>
                  <div className="mt-3 rounded-xl border border-slate-800 bg-gradient-to-r from-blue-500/20 to-transparent px-2.5 py-2">
                    <div className="text-2xl font-light text-slate-100">{incidents.filter(inc => inc.risk_level !== "HIGH_RISK").length.toString().padStart(2, "0")}</div>
                    <div className="mt-1 flex items-center gap-1.5 whitespace-nowrap text-[9px] text-slate-400"><span className="rounded-full bg-emerald-950 px-1.5 py-0.5 text-emerald-400">Safe</span>Guardrail passed</div>
                  </div>
                </div>
                <div className="rounded-2xl border border-slate-800 bg-[#0d1420] p-4 shadow-lg">
                  <div className="flex items-center whitespace-nowrap text-[11px] text-slate-400"><span>↗ &nbsp; Reports Ready</span></div>
                  <div className="mt-3 rounded-xl border border-slate-800 bg-gradient-to-r from-blue-500/20 to-transparent px-2.5 py-2">
                    <div className="text-2xl font-light text-slate-100">{incidents.length.toString().padStart(2, "0")}</div>
                    <div className="mt-1 flex items-center gap-1.5 whitespace-nowrap text-[9px] text-slate-400"><span className="rounded-full bg-blue-950 px-1.5 py-0.5 text-blue-300">Ready</span>Exportable reports</div>
                  </div>
                </div>
              </section>
              )}

          {activeTab === "troubleshoot" && (
          <div id="diagnosis-workspace" className="grid grid-cols-1 gap-4 lg:grid-cols-12">
            {/* Left Column: Log Simulator & Input */}
            <div className="flex flex-col justify-between rounded-2xl border border-slate-800 bg-[#0d1420] p-5 shadow-xl lg:col-span-5">
              <div>
                <div className="flex justify-between items-center mb-3">
                  <span className="text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center gap-1.5">
                    ⚙ &nbsp; Alert Details / Log Input
                  </span>
                  <select
                    value={stack}
                    onChange={(e) => setStack(e.target.value)}
                    className="rounded-lg border border-slate-700 bg-[#111824] px-2.5 py-1 text-xs font-medium text-slate-200 focus:border-blue-500 focus:outline-none"
                  >
                    <option value="All">All Stacks</option>
                    <option value="Linux">Linux / Systemd</option>
                    <option value="Nginx">Nginx Proxy</option>
                    <option value="Docker">Docker Engine</option>
                    <option value="Database">PostgreSQL</option>
                  </select>
                </div>

                <div className="grid grid-cols-2 gap-2 mb-3">
                  {PRESET_SIMULATIONS.map((sim, idx) => (
                    <button
                      key={idx}
                      onClick={() => { setRawLog(sim.log); setStack(sim.stack); }}
                      className="truncate rounded-xl border border-slate-800 bg-[#111824] p-2.5 text-left text-xs font-medium text-slate-300 shadow-sm transition hover:border-blue-500/50 hover:bg-slate-800"
                      title={sim.label}
                    >
                      ⚡ {sim.label}
                    </button>
                  ))}
                </div>

                <div className="relative">
                  <div className="absolute top-2 right-2 z-10">
                    <button
                      onClick={copyRawLog}
                      className="rounded bg-slate-800 px-2 py-1 font-mono text-[10px] text-slate-300 hover:bg-slate-700"
                    >
                      {logCopied ? "Copied!" : "Copy Log"}
                    </button>
                  </div>
                  <textarea
                    rows={10}
                    value={rawLog}
                    onChange={(e) => setRawLog(e.target.value)}
                    placeholder="Paste Linux /var/log/syslog, journalctl, or container crash trace..."
                    className="w-full rounded-xl border border-slate-800 bg-[#080d17] p-3.5 font-mono text-xs text-blue-200 shadow-inner focus:border-blue-500 focus:outline-none"
                  />
                </div>
              </div>

              <div className="flex gap-2.5 mt-4">
                <button
                  onClick={() => runDiagnosis("manual")}
                  disabled={loading}
                  className="flex flex-1 items-center justify-center gap-2 rounded-xl bg-blue-600 py-3 text-xs font-bold uppercase tracking-wide text-white shadow-lg shadow-blue-950/30 transition hover:bg-blue-500 disabled:opacity-50"
                >
                  {loading ? (
                    <span className="flex items-center gap-2">
                      <svg className="animate-spin h-4 w-4 text-white" viewBox="0 0 24 24" fill="none"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
                      Analyzing Hybrid RAG...
                    </span>
                  ) : "🔍 Diagnose Terminal Log"}
                </button>
                <button
                  onClick={() => runDiagnosis("simulator")}
                  disabled={loading}
                  className="rounded-xl bg-[#152b4c] px-4 py-3 text-xs font-bold uppercase tracking-wide text-blue-100 shadow-lg shadow-blue-950/30 transition hover:bg-[#1b3b69] disabled:opacity-50"
                  title="Simulate Autonomous systemd Agent Webhook"
                >
                  🚀 Agent Alert
                </button>
              </div>
            </div>

            {/* Right Column: Diagnosis & RAG Output */}
            <div className="flex flex-col justify-between rounded-2xl border border-slate-800 bg-[#0d1420] p-5 shadow-xl lg:col-span-7">
              {errorMsg && (
                <div className="bg-red-950/90 border border-red-500 text-red-200 p-4 rounded-xl text-xs font-semibold mb-4 shadow-md flex items-center gap-2">
                  <span>❌ API Error:</span> {errorMsg}
                </div>
              )}

              {!result ? (
                <div className="flex h-full flex-col items-center justify-center space-y-3 py-20 text-center text-slate-500">
                  <div className="flex h-14 w-14 items-center justify-center rounded-2xl border border-slate-800 bg-[#080d17] text-2xl text-blue-300 shadow-inner">
                    🛡️
                  </div>
                  <div>
                    <p className="text-sm font-semibold text-slate-300">SentinelOps Ready for Incident Triage</p>
                    <p className="text-xs text-slate-500 max-w-sm mt-1">Select a simulated Linux failure on the left or trigger the systemd collector agent to stream real-time AIOps diagnostics.</p>
                  </div>
                </div>
              ) : (
                <div className="space-y-5">
                  {result.diagnosis.risk_level === "HIGH_RISK" ? (
                    <div className="bg-red-950/90 border border-red-500 text-red-200 px-4 py-3 rounded-xl text-xs font-semibold shadow-md flex items-center justify-between">
                      <span>⚠️ HIGH-RISK COMMAND GUARDRAIL: Destructive command detected ({result.diagnosis.flagged_commands?.join(", ")}).</span>
                      <span className="bg-red-900 px-2 py-0.5 rounded text-[10px] uppercase">Manual Review Required</span>
                    </div>
                  ) : (
                    <div className="bg-emerald-950/40 border border-emerald-700/60 text-emerald-300 px-4 py-2.5 rounded-xl text-xs font-semibold flex justify-between items-center shadow-sm">
                      <span className="flex items-center gap-2">🛡️ Command Safety Guardrail: <strong className="text-emerald-400">SAFE</strong></span>
                      <span className="text-slate-400 text-[11px]">Noise Lines Filtered: <strong className="text-white">{result.noise_lines_dropped}</strong></span>
                    </div>
                  )}

                  <div className="space-y-1.5">
                    <div className="flex justify-between items-center text-xs font-bold uppercase tracking-wider text-slate-400">
                      <span>Sanitized Payload Sent to LLM</span>
                      <span className="text-amber-400 font-mono font-normal">
                        {Object.keys(result.redactions || {}).length > 0
                          ? `Redacted: ${JSON.stringify(result.redactions)}`
                          : "🔒 Zero PII/Secrets Exposed"}
                      </span>
                    </div>
                    <pre className="bg-slate-950 border border-slate-800/80 p-3 rounded-xl font-mono text-xs text-amber-300 overflow-x-auto shadow-inner">{result.sanitized_log}</pre>
                  </div>

                  <div className="space-y-1">
                    <span className="text-xs font-bold uppercase tracking-wider text-slate-400 block">🧠 Root Cause Analysis</span>
                    <p className="text-sm text-slate-200 leading-relaxed bg-slate-950/40 border border-slate-800/50 p-3.5 rounded-xl">{result.diagnosis.root_cause}</p>
                  </div>

                  <div className="space-y-1.5">
                    <div className="flex justify-between items-center">
                      <span className="text-xs font-bold uppercase tracking-wider text-slate-400">🛠️ Verified Remediation Commands</span>
                      <button
                        onClick={() => copyCommands(result.diagnosis.fix_commands || [])}
                        className="rounded-lg bg-slate-800 px-3 py-1 text-xs font-medium text-blue-300 shadow-sm transition hover:bg-slate-700"
                      >
                        {copied ? "✨ Copied to Clipboard!" : "📋 Copy Commands"}
                      </button>
                    </div>
                    <pre className="overflow-x-auto rounded-xl border border-slate-800/80 bg-[#080d17] p-3.5 font-mono text-xs text-blue-300 shadow-inner">
                      {(result.diagnosis.fix_commands || []).join("\n")}
                    </pre>
                  </div>

                  <div className="space-y-1.5 pt-1">
                    <span className="text-xs font-bold uppercase tracking-wider text-slate-400 block">📚 Grounded Knowledge Base Citations</span>
                    <div className="flex flex-wrap gap-2">
                      {(result.diagnosis.citations || []).map((c, idx) => (
                        <span key={idx} className="bg-cyan-950/60 border border-cyan-700/60 text-cyan-300 text-xs px-3 py-1.5 rounded-xl font-mono shadow-sm flex items-center gap-1.5">
                          <span>📌</span> {c}
                        </span>
                      ))}
                    </div>
                  </div>
                </div>
              )}
            </div>
          </div>
          )}

          {/* Bottom Persistent Incident Feed */}
          {activeTab === "alerts" && (
          <div id="incident-feed" className="space-y-4 rounded-2xl border border-slate-800 bg-[#0d1420] p-5 shadow-xl">
            <div className="flex flex-wrap justify-between items-center gap-4">
              <div>
                <h2 className="flex items-center gap-2 text-sm font-semibold tracking-wide text-slate-200">
                  System Alert Feed <span className="rounded-full border border-blue-500/30 bg-blue-500/10 px-2 py-0.5 font-mono text-[10px] text-blue-300">Live</span>
                </h2>
                <p className="mt-1 text-xs text-slate-400">Recent telemetry, safety findings, and AI-generated incident reports.</p>
              </div>
              <div className="flex items-center gap-3">
                <select
                  value={filterTag}
                  onChange={(e) => setFilterTag(e.target.value)}
                  aria-label="Filter incidents by stack"
                  className="rounded-full border border-slate-800 bg-[#111824] px-3 py-2 text-xs text-slate-300 focus:border-blue-500 focus:outline-none"
                >
                  <option value="All">Filter Stack: All</option>
                  <option value="Linux">Linux</option>
                  <option value="Nginx">Nginx</option>
                  <option value="Docker">Docker</option>
                  <option value="Database">Database</option>
                </select>
                <button onClick={fetchIncidents} className="rounded-full bg-blue-600 px-4 py-2 text-xs font-medium text-white transition hover:bg-blue-500">
                  🔄 Refresh Feed
                </button>
              </div>
            </div>

            <div className="overflow-x-auto rounded-xl border border-slate-800/80 bg-[#0a111c]">
              <table className="w-full border-collapse text-left text-xs">
                <thead>
                  <tr className="border-b border-slate-800 bg-[#111824] text-slate-400">
                    <th className="px-4 py-3 font-medium">Alert Details</th>
                    <th className="px-4 py-3 font-medium">Source / Device</th>
                    <th className="px-4 py-3 font-medium">Timestamp</th>
                    <th className="px-4 py-3 font-medium">Severity</th>
                    <th className="px-4 py-3 font-medium">Status</th>
                    <th className="px-4 py-3 font-medium">Action</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800/70">
                  {filteredIncidents.map((inc) => (
                    <tr key={inc.id} className="transition hover:bg-slate-800/40">
                      <td className="max-w-sm px-4 py-3">
                        <div className="font-medium text-slate-200">{inc.root_cause || `Incident #${inc.id}`}</div>
                        <div className="mt-1 truncate text-[10px] text-slate-500">#INC-{inc.id} · {inc.source_type}</div>
                      </td>
                      <td className="px-4 py-3">
                        <div className="font-medium text-slate-200">{inc.hostname}</div>
                        <div className="mt-1 text-[10px] text-slate-500">{inc.stack_tag}</div>
                      </td>
                      <td className="whitespace-nowrap px-4 py-3 text-slate-300">
                        <div>{inc.created_at}</div>
                        <div className="mt-1 text-[10px] text-slate-500">UTC</div>
                      </td>
                      <td className="px-4 py-3">
                        <span className={`rounded-full px-2.5 py-1 text-[10px] font-semibold ${inc.risk_level === "HIGH_RISK" ? "bg-red-950 text-red-300" : "bg-blue-950 text-blue-300"}`}>
                          {inc.risk_level === "HIGH_RISK" ? "Critical" : "Info"}
                        </span>
                      </td>
                      <td className="px-4 py-3 text-slate-300">Analyzed</td>
                      <td className="px-4 py-3">
                        <a href={`/api/export/${inc.id}`} download={`SentinelOps_Incident_${inc.id}.md`} className="font-medium text-blue-300 hover:text-blue-200 hover:underline">
                          ↓ Report
                        </a>
                      </td>
                    </tr>
                  ))}
                  {filteredIncidents.length === 0 && (
                    <tr><td colSpan="6" className="py-8 text-center font-medium text-slate-500">No incident records found for this filter. Trigger a simulation or agent alert above.</td></tr>
                  )}
                </tbody>
              </table>
            </div>
            <div className="flex items-center justify-between text-[10px] text-slate-500">
              <span>Showing {filteredIncidents.length} of {incidents.length} recent alerts</span>
              <span>Local incident history</span>
            </div>
          </div>
          )}
          </main>
        </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
