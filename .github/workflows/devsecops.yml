name: SentinelOps DevSecOps CI/CD & Linux Telemetry Runner

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      fault_type:
        description: "Linux Fault to Inject on Ubuntu Runner (nginx | oom | disk | docker)"
        required: true
        default: "nginx"
  schedule:
    - cron: '0 */12 * * *'

jobs:
  security-and-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scan (CSIT654 Security Gate)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and test tools
        run: |
          python -m pip install -r requirements.txt pytest pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

      - name: Run Statistical RAG Benchmark
        run: |
          python scripts/evaluate_system.py

  linux-agent-telemetry-node:
    if: github.event_name != 'pull_request'
    needs: security-and-benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install Python Requests & Nginx on Ubuntu Runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-requests nginx

      - name: Inject Real Nginx Port-80 Conflict & Ship Telemetry
        env:
          SENTINELOPS_URL: ${{ secrets.RENDER_WEBHOOK_URL }}
          SENTINELOPS_API_KEY: ${{ secrets.SENTINELOPS_API_KEY }}
          FAULT_TYPE: ${{ github.event.inputs.fault_type || 'nginx' }}
        run: |
          if [ -z "$SENTINELOPS_URL" ] || [ -z "$SENTINELOPS_API_KEY" ]; then
            echo "Webhook URL or API key secret is missing; skipping live webhook push."
            exit 0
          fi
          case "$FAULT_TYPE" in
            nginx|oom|disk|docker) ;;
            *)
              echo "Unsupported fault type: $FAULT_TYPE" >&2
              exit 1
              ;;
          esac

          # Wake Render free instance first
          HEALTH_URL="${SENTINELOPS_URL%/api/webhook/ingest}/api/health"
          curl -fsS --connect-timeout 5 --max-time 30 --retry 3 --retry-delay 5 "$HEALTH_URL" || true

          # Intentionally bind port 80 so nginx fails with real EADDRINUSE
          sudo systemctl stop nginx || true
          sudo nohup python3 -m http.server 80 >/dev/null 2>&1 &
          sleep 1
          sudo systemctl start nginx || true

          # Run Layer 2 Linux Collector Agent against live Ubuntu telemetry
          python3 agent/linux_collector.py --simulate "$FAULT_TYPE"
