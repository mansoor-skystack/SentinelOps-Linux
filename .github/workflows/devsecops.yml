name: SentinelOps DevSecOps CI/CD & Keep-Alive

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */12 * * *'

jobs:
  security-and-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scan (CSIT654 Security Gate)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Run Statistical Benchmark
        run: |
          pip install -r requirements.txt
          python scripts/evaluate_system.py

  keep-alive-ping:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render Cloud Endpoint
        env:
          RENDER_HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
        run: |
          if [ -n "$RENDER_HEALTH_URL" ]; then
            curl -fsS "$RENDER_HEALTH_URL" || true
          fi
