name: SentinelOps CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest Tests/test_sentinelops.py -q

  scans:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Scan tracked source for secrets
        run: |
          docker run --rm \
            --network none \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            zricethezav/gitleaks:v8.25.0 \
            dir --config .gitleaks.toml --redact --exit-code 1 .
      - name: Validate demo Compose configuration
        run: |
          cat > .env.demo <<'EOF'
          ADMIN_PASSWORD=ci-demo-admin-password-long-enough
          SESSION_SECRET=ci-demo-session-secret-long-enough-1234567890
          SENTINELOPS_API_KEY=ci-demo-api-key
          POSTGRES_PASSWORD=ci-demo-postgres-password
          SSH_REMEDIATION_ENABLED=false
          EOF
          docker compose --env-file .env.demo config --quiet
      - name: Build application image
        run: docker build --tag sentinelops:ci .
      - name: Build disposable SSH target image
        run: docker build --tag sentinelops-demo-ssh-target:ci demo/ssh-target
      - name: Build disposable SSH key generator image
        run: docker build --tag sentinelops-demo-ssh-keys:ci demo/ssh-keys
      - name: Pull PostgreSQL image
        run: docker pull postgres:16
      - name: Scan demo images
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          for image in sentinelops:ci sentinelops-demo-ssh-target:ci sentinelops-demo-ssh-keys:ci postgres:16; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$RUNNER_TEMP/trivy-cache:/root/.cache/" \
              aquasec/trivy:0.58.1 \
              image --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 "$image"
          done
